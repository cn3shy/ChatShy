# ChatShy Spring Boot 配置
# .env 与 Node 版保持同一份（KEY=VALUE），存在时自动加载；环境变量优先级更高。
spring:
  application:
    name: chatshy
  config:
    import: optional:file:./.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: always
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/chatshy}
    username: ${DB_USER:chatshy}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      pool-name: chatshy-pg

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8088}
  address: ${HOST:0.0.0.0}
  shutdown: immediate
  forward-headers-strategy: none
  tomcat:
    max-connections: 8192

chatshy:
  admin-password: ${ADMIN_PASSWORD:}
  caller-key: ${CALLER_KEY:}
  default-timeout-ms: ${DEFAULT_TIMEOUT_MS:180000}
  model-name: ${MODEL_NAME:chatshy}
  sse-ping-ms: ${SSE_PING_MS:15000}
  hub-ping-ms: ${HUB_PING_MS:20000}
  typewriter-tick-ms: ${TYPEWRITER_TICK_MS:25}
  new-thread-limit: ${NEW_THREAD_LIMIT:5}
  new-thread-window-ms: ${NEW_THREAD_WINDOW_MS:60000}
  dounai:
    enabled: ${DOUNAI_ENABLED:true}
    port: ${DOUNAI_PORT:8099}
    host: ${DOUNAI_HOST:127.0.0.1}
    caller: ${DOUNAI_CALLER:豆奶}
    system-prompt: ${DOUNAI_SYSTEM_PROMPT:}
    upstream-base-url: ${DOUNAI_UPSTREAM_BASE_URL:}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
