name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: mvn -B -f server-java/pom.xml -DskipTests package

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dounai/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm -C dounai install --frozen-lockfile
          pnpm -C dounai build

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp server-java/target/chatshy-server.jar dist/
          tar -czf dist/dounai-dist.tar.gz -C dounai/dist .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/chatshy-server.jar dist/dounai-dist.tar.gz \
            --title "$TAG" \
            --notes "commit: ${{ github.sha }}" \
            --latest

      - name: Keep only the latest 10 releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^build-[0-9]+$' | tail -n +11 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
