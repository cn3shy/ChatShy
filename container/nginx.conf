# ChatShy nginx：托管前端 + 反代后端
# 单域名 dounai.chat，对外 80。
#   /                  豆奶聊天页（index.html）
#   /admin             操作台（admin.html）
#   /v1、/api、/admin/api、/healthz   反代到后端 chatshy:8088
# 后端 DOUNAI_ENABLED=false（独立豆奶端口不再监听），前端与 API 全走 80。

upstream chatshy_backend {
    server chatshy:8088;
    keepalive 16;
}

# SSE / 流式关键：关闭缓冲、加长读写超时（默认挂起 180s，留余量）
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
client_max_body_size 32m;

server {
    listen 80;
    server_name dounai.chat;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    root /app/dounai/dist;

    # ---- 后端 API：网关、操作台、豆奶同源接口、健康检查 ----
    location /v1/            { proxy_pass http://chatshy_backend; }
    location = /v1           { proxy_pass http://chatshy_backend; }
    location /api/           { proxy_pass http://chatshy_backend; }
    location /admin/api/     { proxy_pass http://chatshy_backend; }
    location = /healthz      { proxy_pass http://chatshy_backend; }

    # ---- 控制台 SPA 入口 ----
    location = /admin {
        try_files /admin.html =404;
    }
    location = /admin/ {
        try_files /admin.html =404;
    }

    # ---- 豆奶 SPA：根路径返回 index.html，其余交给前端路由 ----
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }

    # ---- 静态资源（Vite 产物：/dounai-assets/**、/icon.jpg）----
    location /dounai-assets/ {
        try_files $uri =404;
    }
    location = /icon.jpg {
        try_files $uri =404;
    }
}
